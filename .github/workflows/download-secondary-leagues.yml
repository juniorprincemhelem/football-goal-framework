name: Download secondary-league football data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download available league-season CSVs and inspect odds coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secondary-football-data
          python - <<'PY'
          import csv, io, json, time, urllib.request, urllib.error, zipfile
          from pathlib import Path

          leagues = {
              "B1": "Belgium",
              "N1": "Netherlands",
              "SC0": "Scotland",
              "T1": "Turkey",
              "G1": "Greece",
          }
          seasons = [f"{y:02d}{(y+1):02d}" for y in range(12, 25)]
          required = {"Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG"}
          out = Path("secondary-football-data")
          manifest = []
          missing = []
          failures = []

          for season in seasons:
              for code, country in leagues.items():
                  name = f"{season}_{code}.csv"
                  url = f"https://www.football-data.co.uk/mmz4281/{season}/{code}.csv"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=40) as response:
                          raw = response.read()
                      decoded = raw.decode("cp1252", errors="replace")
                      reader = csv.DictReader(io.StringIO(decoded))
                      fields = list(reader.fieldnames or [])
                      if not required.issubset(set(fields)):
                          raise ValueError(f"Missing result columns; found {fields}")
                      rows = list(reader)
                      if not rows:
                          raise ValueError("No match rows")
                      (out / name).write_bytes(raw)
                      odds_fields = [f for f in fields if any(k in f.upper() for k in ("B365C", "PSCH", "AVGCH", "MAXCH", "WHCH", "VCCH", "IWCH", "BWCH", "BFCH"))]
                      odds_rows = sum(1 for r in rows if any((r.get(f) or "").strip() for f in odds_fields))
                      manifest.append({
                          "season": season, "league": code, "country": country,
                          "file": name, "matches": len(rows), "columns": fields,
                          "closing_odds_columns": odds_fields,
                          "rows_with_closing_odds": odds_rows
                      })
                      print(f"OK {name}: {len(rows)} matches; closing odds fields={len(odds_fields)}; odds rows={odds_rows}")
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          missing.append(name)
                          print(f"MISSING {name}: 404 (not published)")
                      else:
                          failures.append(f"{name}: HTTP {exc.code}")
                          print(f"FAILED {name}: HTTP {exc.code}")
                  except Exception as exc:
                      failures.append(f"{name}: {exc}")
                      print(f"FAILED {name}: {exc}")
                  time.sleep(0.25)

          (out / "manifest.json").write_text(json.dumps({
              "leagues": leagues, "seasons": seasons, "available_files": manifest,
              "missing_files": missing, "failures": failures
          }, indent=2), encoding="utf-8")

          print(f"\nAvailable files: {len(manifest)}/65")
          print(f"Missing (404): {len(missing)}")
          print(f"Failures: {len(failures)}")
          if failures:
              raise SystemExit("One or more downloads failed validation; inspect log.")
          if len(manifest) < 20:
              raise SystemExit("Too few league-season files available; refusing to package.")
          with zipfile.ZipFile("secondary-football-data.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(out.iterdir()):
                  z.write(path, arcname=path.name)
          print("Created secondary-football-data.zip")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: secondary-football-data
          path: secondary-football-data.zip
          if-no-files-found: error
          retention-days: 7
