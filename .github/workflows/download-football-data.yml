name: Download football-data datasets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate 65 league-season CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p football-data
          python - <<'PY'
          import csv, io, urllib.request, zipfile
          from pathlib import Path

          leagues = ["E0", "D1", "SP1", "I1", "F1"]
          seasons = [f"{y:02d}{(y+1):02d}" for y in range(12, 25)]
          required = {"Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG"}
          out = Path("football-data")
          failures = []
          downloaded = 0

          for season in seasons:
              for league in leagues:
                  name = f"{season}_{league}.csv"
                  url = f"https://www.football-data.co.uk/mmz4281/{season}/{league}.csv"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                      text = raw.decode("cp1252", errors="replace")
                      reader = csv.DictReader(io.StringIO(text))
                      fields = set(reader.fieldnames or [])
                      if not required.issubset(fields):
                          raise ValueError(f"Missing required columns: {reader.fieldnames}")
                      rows = list(reader)
                      if not rows:
                          raise ValueError("CSV contains no match rows")
                      (out / name).write_bytes(raw)
                      downloaded += 1
                      print(f"OK {name}: {len(rows)} rows")
                  except Exception as exc:
                      failures.append(f"{name}: {exc}")
                      print(f"FAILED {name}: {exc}")

          print(f"Downloaded {downloaded}/65 files")
          if failures:
              print("\n".join(failures))
              raise SystemExit("Dataset incomplete; refusing to package partial archive.")

          with zipfile.ZipFile("football-data-65-csvs.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(out.glob("*.csv")):
                  z.write(path, arcname=path.name)
          print("Created football-data-65-csvs.zip")
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-data-65-csvs
          path: football-data-65-csvs.zip
          if-no-files-found: error
          retention-days: 7
